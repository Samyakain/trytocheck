name: Mirror main to GitLab

on:
  push:
    branches:
      - main
    tags:
      - '**'

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and tags to GitLab
        run: |
          git remote add gitlab \
            https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@codevault.cyntexa.com/samyakjain1/tryfinal.git

          git push gitlab main:main --force
          git push gitlab --tags --force